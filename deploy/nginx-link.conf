# FCC Link — Nginx server block for link.gajc.site (and Phase 2 domains fcc.li, amp.ad)
#
# Lives on the VM at ~/pentecost/nginx/conf.d/link.conf.
# pentecost-nginx-1's docker-compose.relay.yml mounts the conf.d directory at /etc/nginx/conf.d.
#
# TLS Certificate Issuance:
#   certbot certonly --webroot -w /home/azureuser/pentecost/web -d link.gajc.site
#
# Reload after changes:
#   docker exec pentecost-nginx-1 nginx -t && docker exec pentecost-nginx-1 nginx -s reload

# ── HTTP: ACME challenges + redirect to HTTPS ────────────────────────────────
server {
    listen 80;
    server_name link.gajc.site fcc.li amp.ad;

    # Let's Encrypt webroot (host path /home/azureuser/pentecost/web)
    location /.well-known/acme-challenge/ {
        root /var/www/pentecost;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── link.gajc.site — FCC Link Management Portal & API ────────────────────────
server {
    listen 443 ssl http2;
    server_name link.gajc.site;

    ssl_certificate     /etc/letsencrypt/live/link.gajc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link.gajc.site/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Max body size for CSV uploads
    client_max_body_size 10m;

    location / {
        # Resolve container name dynamically via Docker internal DNS
        resolver 127.0.0.11 valid=30s;
        set $link_upstream http://fcc-li-web:8000;
        proxy_pass $link_upstream;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
